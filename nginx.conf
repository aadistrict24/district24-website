server {
#     listen      8080;
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # ── main site ─────────────────────────────────────────────
    # Astro pre-renders every page to <route>/index.html, so /cpc is served
    # from /cpc/index.html. Unknown paths get the generated 404 page.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
